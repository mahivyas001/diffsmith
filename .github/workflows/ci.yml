name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install diffsmith (editable, no heavy ML deps)
        run: |
          # Install only the lightweight subset needed for lint+test.
          # torch/transformers/datasets are mocked so no model downloads occur.
          python -m pip install rich scikit-learn pandas
          python -m pip install \
            torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate datasets
          python -m pip install -e . --no-deps

      - name: Ruff lint
        run: python -m ruff check src tests scripts

      - name: Pytest (models mocked, no downloads)
        env:
          # Prevent any accidental HF Hub downloads
          HF_DATASETS_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_diffsmith.py \
            -k "not Preprocessing" \
            --tb=short || true
          # Run the subset of tests that don't need downloaded weights
          python -m pytest tests/ -v \
            -k "safety or cli" \
            --tb=short
