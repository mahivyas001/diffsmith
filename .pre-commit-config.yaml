repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        args: ["--fix"]
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast unit tests)
        entry: python -m pytest tests/ -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
